<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#bdbdbd"/>
  
  <!-- Dark background for contrast -->
  <rect x="10" y="10" width="180" height="180" rx="20" fill="#0a0a0a"/>
  
  <!-- Gradient accent -->
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bdbdbd;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#bdbdbd;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="20" fill="url(#gradientBg)"/>
  
  <!-- Text: MH -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="#bdbdbd" text-anchor="middle" dominant-baseline="middle">MH</text>
</svg>